name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    # Nightly run in addition to the pull-request and main-branch gates.
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  # Frontend tests are pure Python: tracing, IR emission, error reporting
  # and compiler infrastructure. Backend/e2e tests self-skip when the
  # LLVM toolchain is absent.
  python-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install build numpy pytest pre-commit
      - name: Lint and format checks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Frontend tests
        run: |
          set -o pipefail
          PYTHONPATH=python python -m pytest test/python -q | tee pytest.out
      - name: Build Python package
        run: |
          python -m build --wheel --sdist --outdir /tmp/sar-dist
          python -m venv /tmp/sar-venv
          /tmp/sar-venv/bin/pip install /tmp/sar-dist/*.whl
          cd /tmp
          /tmp/sar-venv/bin/python -c \
            "import sar; assert sar.__version__; print(sar.list_backends())"
      # Most of the suite self-skips here (no toolchain), so a green run says
      # little on its own. Pin the floor of tests that must actually execute:
      # it only ever grows, and it fails loudly if a toolchain-free test is
      # accidentally marked `requires_cpu` / `requires_hls`.
      - name: Guard against silent coverage loss
        run: |
          PASSED=$(grep -oE '[0-9]+ passed' pytest.out | tail -1 | cut -d' ' -f1)
          PASSED=${PASSED:-0}
          FLOOR=189
          echo "$PASSED toolchain-free tests ran (floor: $FLOOR)"
          if [ "$PASSED" -lt "$FLOOR" ]; then
            echo "::error::only $PASSED tests ran, expected at least $FLOOR;"\
                 "a frontend test likely became toolchain-dependent"
            exit 1
          fi

  # Compiler and backend correctness is a merge gate. The LLVM tree is
  # cached by submodule revision; a cache miss is expensive but must not let
  # C++ or lowering regressions merge unchecked.
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # The submodule gitlink SHA keys the toolchain cache. It is read from
      # the superproject tree, so this works before `submodule update`.
      - name: Resolve submodule revision
        id: subrev
        run: |
          echo "llvm=$(git rev-parse HEAD:externals/llvm-project)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: sudo apt-get install -y ninja-build

      # Sources are always needed: the cached build tree carries CMake configs
      # that point back into the submodule source directory.
      - name: Check out submodule sources
        run: git submodule update --init externals/llvm-project

      - name: Cache LLVM/MLIR/Clang build
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: externals/llvm-project/build
          key: llvm-${{ runner.os }}-${{ steps.subrev.outputs.llvm }}-${{ hashFiles('scripts/build-llvm.sh') }}

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: make llvm

      - run: make build
      - run: make test
      - name: Runtime ASan and UBSan
        run: |
          cmake -S . -B build-sanitize \
            -DSAR_DSL_ENABLE_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-sanitize --target sar_runtime
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)" \
          ASAN_OPTIONS="detect_leaks=0:halt_on_error=1" \
          UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1" \
          SAR_DSL_RUNTIME_LIB="$PWD/build-sanitize/lib/libsar_runtime.so" \
          PYTHONPATH=python \
            python -m pytest test/python/test_runtime_direct.py -q
      - name: Test installed compiler prefix
        run: |
          cmake --install build --prefix /tmp/sar-install
          /tmp/sar-install/bin/sar-opt --version
          /tmp/sar-install/bin/sar-translate --help >/dev/null
