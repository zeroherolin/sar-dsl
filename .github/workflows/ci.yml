name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Frontend tests are pure Python: tracing, IR emission, error reporting
  # and compiler infrastructure. Backend/e2e tests self-skip when the
  # LLVM toolchain is absent.
  python-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install numpy pytest pyflakes
      - name: Lint
        run: |
          python -m pyflakes python/sar third_party test/python \
            examples/wka/*.py examples/rda/*.py benchmarks/*.py
      - name: Frontend tests
        run: PYTHONPATH=python python -m pytest test/python -q

  # The full build (LLVM submodule + sar-opt + lit + e2e) takes hours of
  # compute; run it on demand or on a schedule rather than per-push.
  full-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: git submodule update --init externals/llvm-project
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: sudo apt-get install -y ninja-build
      - run: make llvm
      - run: make build
      - run: make test
