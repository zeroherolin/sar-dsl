name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` lets the full-build job below be requested on a PR by
    # attaching the `full-ci` label; the other types are the defaults.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    # Nightly full build: the toolchain-dependent suites (lit, e2e imaging
    # chains, HLS emission) never run on the per-push job.
    - cron: "0 2 * * *"

jobs:
  # Frontend tests are pure Python: tracing, IR emission, error reporting
  # and compiler infrastructure. Backend/e2e tests self-skip when the
  # LLVM toolchain is absent.
  python-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install numpy pytest pre-commit
      - name: Lint and format checks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Frontend tests
        run: |
          set -o pipefail
          PYTHONPATH=python python -m pytest test/python -q | tee pytest.out
      # Most of the suite self-skips here (no toolchain), so a green run says
      # little on its own. Pin the floor of tests that must actually execute:
      # it only ever grows, and it fails loudly if a toolchain-free test is
      # accidentally marked `requires_cpu` / `requires_hls`.
      - name: Guard against silent coverage loss
        run: |
          PASSED=$(grep -oE '[0-9]+ passed' pytest.out | tail -1 | cut -d' ' -f1)
          PASSED=${PASSED:-0}
          FLOOR=26
          echo "$PASSED toolchain-free tests ran (floor: $FLOOR)"
          if [ "$PASSED" -lt "$FLOOR" ]; then
            echo "::error::only $PASSED tests ran, expected at least $FLOOR;"\
                 "a frontend test likely became toolchain-dependent"
            exit 1
          fi

  # The full build (LLVM + sar-opt + lit + e2e) takes hours from scratch, so
  # it runs nightly, on demand, and on PRs labeled `full-ci`, with the
  # toolchain tree cached between runs.
  full-build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # The submodule gitlink SHA keys the toolchain cache. It is read from
      # the superproject tree, so this works before `submodule update`.
      - name: Resolve submodule revision
        id: subrev
        run: |
          echo "llvm=$(git rev-parse HEAD:externals/llvm-project)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: sudo apt-get install -y ninja-build

      - name: Cache LLVM/MLIR/Clang build
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: externals/llvm-project/build
          key: llvm-${{ runner.os }}-${{ steps.subrev.outputs.llvm }}-${{ hashFiles('scripts/build-llvm.sh') }}

      # Sources are always needed: the cached build tree carries CMake configs
      # that point back into the submodule source directory.
      - name: Check out submodule sources
        run: git submodule update --init externals/llvm-project

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: make llvm

      - run: make build
      - run: make test
