# Defaults for the reference target. Memory limits are hard compiler caps;
# DSP/FF/LUT are checked after synthesis.
#
# Compile options state the budgets one of two ways, never both:
#
#   options={"part": "xczu9eg-ffvb1156-2-e"}                 # + "utilization"
#   options={"bram_bytes": ..., "uram_bytes": ..., ...}      # all six
#
# The first derives the six from the device table
# (sar.backends.hls.devices.DEVICES); the second uses them as written. With
# neither, the values below apply as they stand.

# Vitis target
part: xcvu13p-fhgb2104-2-i
clock_ns: 4.0
# Explicit HLS scheduling margin (12.5% of the target period).
clock_uncertainty_percent: 12.5

# Percent of a named part the compiler may plan against, leaving the rest
# for interconnect and placement. Only applies when compile options name a
# part -- the budgets below are already the VU13P at this percentage.
utilization: 80

# Resource budgets (80% of the VU13P above)
bram_bytes: 9907200
uram_bytes: 37748736
lutram_bytes: 2883584
dsp: 9830
ff: 2764800
lut: 1382400

# Interface: ap_memory, axi, or stream
interface: axi
axi_bus_bits: 512
axi_max_burst_length: 64
axi_max_outstanding: 16

# Kernel contract
precision: native
top_func: null
