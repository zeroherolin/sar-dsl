[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-dsl"
description = "MLIR-based domain-specific compiler for SAR imaging pipelines"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "SAR-DSL contributors" }]
keywords = ["SAR", "MLIR", "compiler", "DSL", "HLS", "FPGA", "radar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/zeroherolin/sar-dsl"

[project.optional-dependencies]
test = ["pytest>=7"]
examples = ["matplotlib>=3.7"]

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.package-data]
# PEP 561 marker: the package ships inline type annotations.
"sar" = ["py.typed"]
# The HLS backend reads its defaults from this file at compile time.
"sar.backends.hls" = ["hls_config.yaml"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.dynamic]
version = { attr = "sar._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["test/python"]

[tool.yapf]
based_on_style = "pep8"
column_limit = 79

[tool.ruff]
line-length = 79
extend-exclude = ["externals"]

[tool.ruff.lint]
select = ["F", "E", "W"]

[tool.ruff.lint.per-file-ignores]
# Embedded MLIR strings keep one op per line regardless of width.
"test/python/test_affine_fft.py" = ["E501"]
# Lit configs use globals injected by the lit runner.
"test/lit.cfg.py" = ["F821"]
